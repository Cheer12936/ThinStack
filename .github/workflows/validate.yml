name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate.py
      - run: python -B -m unittest discover -s tests -v
      - name: Real toy execution and project-state round trip
        run: python -B examples/project-state/demo.py --root "${{ runner.temp }}/thin-demo"
      - name: Positive and negative harness controls (not a model benchmark)
        run: python -B evals/harness/run.py selftest --output "${{ runner.temp }}/thin-harness" --repeats 1
      - name: Static context budget (not token billing)
        run: python tools/context_budget.py
